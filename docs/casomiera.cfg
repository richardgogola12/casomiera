# Casomiera - nastavenia. Format: kluc=hodnota, # = komentar
# Skopiruj na SD kartu ako /casomiera.cfg
# mode: 1 = LP+PP, 2 = LP, 3 = odpocet
mode=1
# LED terca: 1 = napaja nieco ine (rele sa nepouziva), 0 = rele zopne po zastaveni casu
led_t1=0
led_t2=0
relay_active_low=1
min_run_ms=1000
# odpocet 1-9 minut
countdown_min=4
debounce_ms=30
# intervaly odosielania 20-100 ms (min. 10x za sekundu)
net_interval_ms=100
ser_interval_ms=100
lcd_interval_ms=100
# wifi_mode: AP = vlastna siet, STA = pripojit sa k sieti
wifi_mode=AP
ssid=Casomiera
pass=hasici123
# IP: broadcast alebo konkretna adresa
phone_ip=broadcast
phone_port=5000
disp_ip=broadcast
disp_port=5001
rs232_baud=9600
hc12_baud=9600
lcd_addr=0x27
use_udp=1
use_rs232=1
use_hc12=1
# udp_text: 0 = UDP binarny ramec RW: (ako RS232), 1 = citatelny text $FT
udp_text=0
# USB (COM port ESP32): use_usb=1 posiela ramce RW:, usb_debug=1 posiela texty
use_usb=1
usb_debug=0
usb_baud=115200
